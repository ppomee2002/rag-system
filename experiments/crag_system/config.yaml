# SYS 실험 기본 설정. configs/base.yaml 위에 deep-merge 되고, --overlay / --set 으로 조건을 바꾼다.
# corpus / retriever / dataset 은 기존 crag_latency 와 같다 (같은 FAISS 인덱스, 같은 seed shuffle + limit).
experiment: crag_system
exp_id: SYS-dev                 # 결과 폴더: results/crag_system/<exp_id>/<timestamp>/

dataset:
  name: popqa
  path: data/processed/popqa_longtail.jsonl
  limit: 203                    # 초기 재현. 정확도 검증은 null (1,399 전체)

embedding:
  provider: sentence_transformers
  model: BAAI/bge-base-en-v1.5

retriever:
  type: faiss
  top_k: 5
  index_path: data/processed/popqa_bge-base.faiss
  docs_path: data/processed/popqa_chunks.jsonl
  query_prefix: "Represent this sentence for searching relevant passages: "
  device: cpu                   # vLLM 과 GPU 를 나눠 쓰지 않도록 retrieval 인코더는 CPU

# 주 추론 엔진 (vLLM). Ollama 비교는 --overlay experiments/crag_system/configs/engine_ollama.yaml
llm:
  provider: vllm
  model: meta-llama/Llama-3.1-8B-Instruct
  base_url: http://127.0.0.1:8000/v1
  api_key_env: VLLM_API_KEY
  temperature: 0.0
  max_tokens: 512
  seed: 0
  stream: true
  send_priority: false          # scheduler.engine_priority=key 일 때 true (서버는 --scheduling-policy priority)
  timeout: 600

pipeline: crag_graph            # crag_graph | crag (기존 클래스, 기준 구현) | vanilla

crag:
  upper_threshold: 0.7
  lower_threshold: 0.3
  grader:                       # 비워두면 메인 llm 사용
    provider: null
  web_search:
    provider: tavily            # tavily | replay
    top_k: 5
    search_depth: basic
    record: true                # 실제 검색 결과·지연을 <run_dir>/web_cache.jsonl 에 기록
    replay_paths: []            # provider=replay: 기록 파일들
    latency_mode: recorded      # replay: recorded (기록된 지연) | zero
    replay_fallback: false      # replay miss 시 실제 Tavily 호출 여부

grading:
  strategy: full                # full | lazy_hit | lazy_rest | batch | adaptive
  # full: parallel: false
  # batch: batch_size: null, fallback: individual, max_tokens: null
  # adaptive: probe_k: 1, rest_mode: batch, skip_below_retrieval: null, early_incorrect_retrieval: null

scheduler:
  policy: none                  # none | fcfs | fcfs_query | srpt_est
  slots: 1                      # 동시 전송 수 K (null = 제한 없음)
  aging_alpha: 0.0
  wait_threshold: null          # 초. aging 과 함께 쓰지 않음
  engine_priority: none         # none | key (dispatch key 를 vLLM priority 로 전달)
  cost_model: null              # {path: model.json} | {trace: <sequential run>, service_key: wall}

run:
  mode: sequential              # sequential | live (live 는 --workload 필요)
  warmup_queries: 3             # 측정 제외, 항상 순차 실행. workload pool 에서도 제외됨
  reset_prefix_cache: false     # 시작 전 vLLM prefix cache 초기화 시도 (버전 확인 필요)
