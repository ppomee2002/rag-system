# configs/base.yaml 위에 덮어쓰는 값만 적는다.
# dataset / embedding / retriever / llm 은 chunking 실험에 영향을 주지 않도록 base 대신 여기서 지정한다.
experiment: crag_latency

dataset:
  name: popqa
  path: data/processed/popqa_longtail.jsonl   # C-RAG 논문 long-tail subset (1,399 문항)
  popularity_threshold: 100                   # s_pop < 100 을 long-tail 로 사용

# prepare_data.py 가 수집하는 Wikipedia 문서 (PopQA subject / object 문서)
corpus:
  cache_dir: data/raw/wiki
  pages_path: data/processed/popqa_wiki_pages.jsonl

# base 의 chunking 값이 바뀌어도 이 실험의 corpus 가 바뀌지 않도록 고정
chunking:
  strategy: fixed
  chunk_size: 512
  chunk_overlap: 64

embedding:
  provider: sentence_transformers   # retrieval latency 측정을 위해 로컬 실행
  model: BAAI/bge-base-en-v1.5

retriever:
  type: faiss
  top_k: 5
  index_path: data/processed/popqa_bge-base.faiss
  docs_path: data/processed/popqa_chunks.jsonl
  query_prefix: "Represent this sentence for searching relevant passages: "   # bge v1.5 query instruction
  device: null          # null 이면 자동 (cuda 있으면 cuda)

llm:
  provider: anthropic
  model: claude-haiku-4-5   # temperature 0 지원 + thinking 없음 → latency 분산 최소화
  temperature: 0.0
  max_tokens: 512

crag:
  grader:               # 비워두면 메인 llm 사용
    provider: null
    model: null
  upper_threshold: 0.7
  lower_threshold: 0.3
  web_search:
    provider: tavily
    top_k: 5
    search_depth: basic

# run_noise.py (bad evidence 주입 실험) 전용
noise:
  n_bad: [1, 2, 4]              # gold 에 섞는 bad 문서 개수
  candidate_k: 50               # distracting 후보를 뽑을 검색 깊이
  filter_thresholds: [0.3, 0.5, 0.7]   # grader score 가 이 값 이상인 문서만 남김
  # 실행 / 집계할 condition. null 이면 전부 (gold+rand{n}, dist{N} 등 포함). filter 는 모든 threshold
  conditions: [gold, gold+dist4, filter]
  gold_position: first         # first: context 맨 앞 (질문에서 멂) / last: 맨 뒤

run:
  pipelines: [vanilla, crag]
  warmup_queries: 3     # 측정에서 제외할 초기 query 수 (cold start 영향 제거)
  repeats: 1            # query 당 반복 측정 횟수
