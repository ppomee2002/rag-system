# 모든 실험이 공유하는 기본 설정.
# 실험별 config 는 이 파일을 deep-merge 로 덮어쓴다 (rag.config.load_config).
# 실험 간 공정 비교를 위해 LLM / retriever 설정은 가급적 여기서만 바꾼다.

seed: 42

dataset:
  name: TODO            # 예: hotpotqa, nq, popqa
  path: data/processed/TODO.jsonl
  limit: null           # 디버깅 시 일부 query 만 실행

chunking:
  strategy: fixed
  chunk_size: 512
  chunk_overlap: 64

embedding:
  provider: TODO
  model: TODO

retriever:
  type: TODO            # 예: faiss, bm25
  top_k: 5

llm:
  provider: TODO
  model: TODO
  temperature: 0.0
  max_tokens: 512

output_dir: results
