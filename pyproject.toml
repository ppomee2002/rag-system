[project]
name = "rag-system"
version = "0.1.0"
description = "RAG experiments: C-RAG latency analysis & chunking strategies"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "sentence-transformers>=3.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# C-RAG latency 실험용 (uv sync --extra crag). 기본 의존성과 분리해 chunking 실험 환경에 영향 없음
crag = [
    "anthropic>=1,<2",
    "tavily-python>=0.5",
    "faiss-cpu>=1.9",
    "datasets>=3.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
